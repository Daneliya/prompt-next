name: Check and package

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: go vet ./...
      - run: go test ./...

  package:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - runner: macos-15
            artifact: macos-arm64
            paths: bin/Prompt Next.dmg
          - runner: windows-2025
            artifact: windows-amd64
            paths: |
              bin/prompt-next.exe
              bin/Prompt-Next-amd64-installer.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails CLI at the version declared in go.mod
        shell: bash
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${version}"
      - name: Check tag against the application version
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(node build/version.mjs)"
      - if: runner.os == 'macOS'
        run: wails3 task darwin:package:dmg ARCH=arm64
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:Path = "${env:ProgramFiles(x86)}\NSIS;$env:Path"
          }
          wails3 task windows:package ARCH=amd64
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: packages
          merge-multiple: true
      - name: Upload to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber packages/*
